name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded

  build:
    name: Debug APK (contributor path)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - run: flutter pub get
        # No key.properties in CI on purpose: debug must work without release
        # signing (release is fail-closed and requires key.properties).
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: telepulse-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  release:
    name: Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - name: Version drift gate (tag vs pubspec)
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1 | tr -d '[:space:]')
          echo "tag=$TAG pubspec=$PUBSPEC_VER"
          if [ "$TAG" != "$PUBSPEC_VER" ]; then
            echo "::error::Version drift: tag v$TAG != pubspec $PUBSPEC_VER"
            exit 1
          fi

      - run: >
          flutter build apk --release
          --obfuscate --split-debug-info=debug-info

      - run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=debug-info

      - uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: debug-info/
          retention-days: 30

      - name: Size gate (warning only)
        run: |
          APK=$(ls build/app/outputs/flutter-apk/app-release.apk)
          ls -lh "$APK"
          ls -lh build/app/outputs/bundle/release/*.aab || true
          SIZE=$(stat -c%s "$APK")
          LIMIT=$((50 * 1024 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::warning::Release APK exceeds 50MB: $SIZE bytes"
          fi

      - name: Checksum artifact
        id: sha
        run: |
          APK=$(ls build/app/outputs/flutter-apk/app-release.apk)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/*.aab
          body: |
            Signed release APK + AAB.

            SHA-256 (APK): `${{ steps.sha.outputs.sha }}`
