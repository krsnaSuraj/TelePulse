include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    invalid_use_of_visible_for_testing_member: error

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: false
    always_declare_return_types: true
    unawaited_futures: true
