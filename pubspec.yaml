name: telepulse
description: "MTProto proxy discovery engine for Telegram — find, validate, and connect to working proxies without a VPN."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  package_info_plus: ^8.3.0
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.4
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.5.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B0C0E"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true

  assets:
    - assets/
